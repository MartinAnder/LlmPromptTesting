name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      force_api:
        description: "Force real API calls and refresh snapshots (consumes credits)"
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
        env:
          LLM_PROMPT_TESTING_FORCE_API: ${{ inputs.force_api && 'true' || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.force_api && secrets.ANTHROPIC_API_KEY || '' }}
